android.useAndroidX=true
android.enableJetifier=true
android.jetifier.ignorelist=bcprov-jdk18on,bcprov
android.nonFinalResIds=true
android.suppressUnsupportedCompileSdk=35,36,37
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC
org.gradle.vfs.watch=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true
