[package]
name = "mirrlyvpn"
version = "1.0.0"
edition = "2021"
authors = ["R1Xern (Mirrly Dev)"]
description = "Mirrly TG Proxy - Native L3 VPN, AmneziaWG & Cloudflare WARP Engine"

[lib]
name = "mirrlyvpn"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "time", "sync", "macros", "process"] }
tokio-util = "0.7"
ring = { version = "0.17", default-features = false, features = ["std"] }
once_cell = "1"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true
incremental = false

[profile.release.build-override]
opt-level = 0
codegen-units = 16

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.dev.build-override]
opt-level = 0
codegen-units = 16

[dev-dependencies]
tokio = { version = "1.40", features = ["test-util"] }
