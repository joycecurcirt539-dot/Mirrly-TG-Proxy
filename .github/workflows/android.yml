name: Android CI & Engine Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify (Rust Engines + APKs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 35
          ndk: '28.2.13676358'

      - name: Cache Cargo & Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            mirrlyengine/target/
            mirrlyvpn/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('mirrlyengine/Cargo.lock', 'mirrlyvpn/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permissions
        run: chmod +x ./gradlew ./build_native.sh ./tools/build/build_native.sh

      - name: Run Rust Engine Tests (mirrlyengine & mirrlyvpn)
        run: |
          (cd mirrlyengine && cargo test)
          (cd mirrlyvpn && cargo test)

      - name: Build Native Rust Engines (mirrlyengine & mirrlyvpn for 4 ABIs)
        run: ./build_native.sh

      - name: Verify Native Libraries & 16 KiB ELF Alignment
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${NDK_HOME:-$(ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)}}}"
          LLVM_READELF=""
          if [ -n "$NDK_DIR" ] && [ -d "$NDK_DIR/toolchains/llvm/prebuilt" ]; then
            LLVM_READELF="$(find "$NDK_DIR/toolchains/llvm/prebuilt" -type f -name llvm-readelf 2>/dev/null | head -n 1 || true)"
          fi
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for lib in libmirrlyengine.so libmirrlyvpn.so; do
              so_path="app/src/main/jniLibs/$abi/$lib"
              if [ ! -f "$so_path" ]; then
                echo "ERROR: Missing native library $so_path" >&2
                exit 1
              fi
              if [ -n "$LLVM_READELF" ] && { [ "$abi" = "arm64-v8a" ] || [ "$abi" = "x86_64" ]; }; then
                echo "Checking 16 KiB LOAD segment alignment for $so_path"
                "$LLVM_READELF" -lW "$so_path" | awk '$1 == "LOAD" {print $NF}' | sort -u
                while IFS= read -r align; do
                  [ -z "$align" ] && continue
                  if (( align < 16384 )); then
                    echo "ERROR: Non-16KiB LOAD alignment in $so_path: $align" >&2
                    exit 1
                  fi
                done < <("$LLVM_READELF" -lW "$so_path" | awk '$1 == "LOAD" {print $NF}' | sort -u)
              fi
            done
          done

      - name: Setup Release Keystore (if secret is configured)
        if: ${{ env.HAVE_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks
        env:
          HAVE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build Release APKs (or Debug check when keystore is absent)
        run: |
          if [ -f "release.jks" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify Alignment and Print SHA-256 Hashes
        run: |
          echo "============================================="
          echo "Generated Release APKs SHA-256 Checksums"
          echo "============================================="
          if [ -d "app/build/outputs/apk/release" ]; then
            sha256sum app/build/outputs/apk/release/*.apk
            ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1 || true)"
            if [ -n "$ZIPALIGN" ]; then
              for apk in app/build/outputs/apk/release/*.apk; do
                "$ZIPALIGN" -c -P 16 4 "$apk"
              done
            fi
          fi

      - name: Upload Release APKs Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mirrly-proxy-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
